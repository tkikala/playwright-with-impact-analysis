name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout real SUT
        run: git clone --depth=1 https://github.com/mxschmitt/playwright-test-coverage.git _sut/playwright-test-coverage

      - name: Prepare real SUT
        working-directory: _sut/playwright-test-coverage
        run: |
          npm ci
          npm install "$GITHUB_WORKSPACE"
          node -e "require('node:fs').writeFileSync('e2e/baseFixtures.ts', \"import { test as base, expect } from '@playwright/test';\\nimport { collectImpactCoverage } from 'playwright-impact-analysis/playwright/collector';\\nexport const test = base.extend({});\\ntest.afterEach(async ({ page }, testInfo) => {\\n  await collectImpactCoverage({ page, testInfo });\\n});\\nexport { expect };\\n\")"
          npx playwright install --with-deps chromium

      - name: Capture SUT metadata
        run: |
          echo "MATRIX_REPOSITORY=mxschmitt/playwright-test-coverage" >> "$GITHUB_ENV"
          echo "MATRIX_SOURCE_URL=https://github.com/mxschmitt/playwright-test-coverage" >> "$GITHUB_ENV"
          echo "MATRIX_BRANCH=$(git -C _sut/playwright-test-coverage branch --show-current)" >> "$GITHUB_ENV"
          echo "MATRIX_SHA=$(git -C _sut/playwright-test-coverage rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Generate real SUT matrix snapshot
        working-directory: _sut/playwright-test-coverage
        run: |
          node "$GITHUB_WORKSPACE/src/cli.mjs" record \
            --matrix-path .playwright-impact/matrix.json \
            --coverage-dir .playwright-impact/coverage \
            --source-roots src \
            --test-command "npm test"

      - name: Build Pages catalog
        run: node scripts/build-pages-catalog.mjs _sut/playwright-test-coverage/.playwright-impact/matrix.json

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
