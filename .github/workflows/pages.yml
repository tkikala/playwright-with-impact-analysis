name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python tooling
        run: |
          python -m pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Checkout real SUT
        run: git clone --depth=1 https://github.com/sourcegraph/ecommerce-app.git _sut/ecommerce-app

      - name: Prepare real SUT backend
        working-directory: _sut/ecommerce-app/backend
        run: uv sync

      - name: Prepare real SUT frontend
        working-directory: _sut/ecommerce-app/frontend
        run: |
          npm ci
          npm install "$GITHUB_WORKSPACE" vite-plugin-istanbul
          npx playwright install --with-deps chromium

      - name: Patch real SUT for impact recording
        run: node scripts/prepare-sourcegraph-ecommerce-sut.mjs _sut/ecommerce-app

      - name: Capture SUT metadata
        run: |
          echo "MATRIX_REPOSITORY=sourcegraph/ecommerce-app" >> "$GITHUB_ENV"
          echo "MATRIX_SOURCE_URL=https://github.com/sourcegraph/ecommerce-app" >> "$GITHUB_ENV"
          echo "MATRIX_BRANCH=$(git -C _sut/ecommerce-app branch --show-current)" >> "$GITHUB_ENV"
          echo "MATRIX_SHA=$(git -C _sut/ecommerce-app rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Generate real SUT matrix snapshot
        working-directory: _sut/ecommerce-app/frontend
        run: |
          node "$GITHUB_WORKSPACE/src/cli.mjs" record \
            --matrix-path .playwright-impact/matrix.json \
            --coverage-dir .playwright-impact/coverage \
            --source-roots src \
            --test-command "PW_IMPACT_COVERAGE=1 npm run test:e2e"

      - name: Build Pages catalog
        run: node scripts/build-pages-catalog.mjs _sut/ecommerce-app/frontend/.playwright-impact/matrix.json

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
